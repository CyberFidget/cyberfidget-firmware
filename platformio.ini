; CyberFidget Music Player Firmware
; Branch: music_player_v2
; Stripped build targeting BT A2DP + MP3 playback within IRAM budget
;
; Usage:
;   pio run -e local -t upload     ; Flash over USB serial
;   pio run -e remote -t upload    ; Flash over SSH (flash_remote.bat)
;   pio run -e local -t monitor    ; Serial monitor (local only)
;
; Switch active env in VSCode: click the env name in the status bar (bottom)

[platformio]
default_envs = local

; ============================================================
; Shared base config — inherited by both 'local' and 'remote'
; ============================================================
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = adafruit_feather_esp32_v2
framework = arduino

; --- Memory & Partition ---
board_build.partitions = default_8MB.csv     ; ~3.2MB x2 APP partitions (OTA capable)
board_build.flash_mode = qio
board_build.f_cpu = 240000000L              ; 240MHz (WiFi/BT)
board_build.flash_freq = 80000000L
board_build.flash_size = 8MB
board_build.psram = enabled

; --- Build Type ---
build_type = release                        ; Critical: release avoids debug IRAM overhead

; --- Library Resolution ---
lib_ldf_mode = deep+
; strict makes the LDF honor library.json "platforms" fields — required so
; lib/HALMock (platforms: native, ships Arduino.h/SD.h/SPI.h test shims)
; can never shadow the real framework headers in device builds.
lib_compat_mode = strict
lib_extra_dirs = lib

lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    adafruit/Adafruit NeoPixel@^1.12.3
    sparkfun/SparkFun LIS2DH12 Arduino Library@^1.0.3
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
    ; Audio Stack
    git+https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.0
    git+https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.9
    git+https://github.com/pschatzmann/arduino-libhelix.git#v0.8.7
    ; WiFi Transfer (fallback mode - no WiFiManager needed, just raw AP + web server)
    git+https://github.com/me-no-dev/ESPAsyncWebServer.git

build_flags =
    ; --- Size Optimization ---
    -Os

    ; --- The loop task is small. wasm3's deep native recursion runs on a
    ; dedicated on-demand task (lib/WasmFsApp) created at wasm-app launch and
    ; destroyed on exit; its interpreter stack (kGuestStackBytes there) is in
    ; PSRAM, so a running wasm app holds only a few KB of internal RAM. The
    ; native-stack guard (lib/wasm3 library.json) remains the backstop. ---
    -DARDUINO_LOOP_STACK_SIZE=16384

    ; --- Portal Internal-Heap Budget ---
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192        ; 8KB async_tcp stack; bench high-water and retune if needed
    -DWS_MAX_QUEUED_MESSAGES=4                ; bound queued WebSocket copies in the portal heap budget
    -DDEFAULT_MAX_WS_CLIENTS=2                ; bound portal WebSocket client bookkeeping

    ; --- Disable Logging (saves flash + RAM) ---
    -DCORE_DEBUG_LEVEL=0
    -DNDEBUG

    ; --- BT Config ---
    ; NOTE: Do NOT set -DCONFIG_BT_BLE_ENABLED=0 here. The precompiled BT
    ; libraries were built with BLE support, so overriding the flag creates
    ; an inconsistent config that breaks esp_bt_controller_init().
    ; A2DPStream releases BLE memory at runtime via esp_bt_controller_mem_release().
    -DCONFIG_BT_NIMBLE_ENABLED=0

    ; --- AudioTools IRAM Diet ---
    -DAUDIOTOOLS_NO_ANALOG                   ; No analog audio drivers
    -DAUDIOTOOLS_NO_PWM                      ; No PWM audio
    -DAUDIOTOOLS_NO_ADC                      ; No ADC audio
    -DAUDIOTOOLS_NO_DAC                      ; No DAC audio

    ; --- SPP Support (override IDF 5.x gate - API confirmed present) ---
    -DA2DP_SPP_SUPPORT=1

    ; --- Additional IRAM Savings ---
    -DCONFIG_ESP32_WIFI_IRAM_OPT=0           ; WiFi IRAM optimizations off
    -DCONFIG_ESP32_WIFI_RX_IRAM_OPT=0
    ; NOTE: Do NOT set -DCONFIG_NEWLIB_NANO_FORMAT=1 here. The precompiled BT
    ; library was built WITHOUT this flag (TASK_EXTRA_STACK_SIZE=512), so our
    ; config struct would have a smaller stack size (3584 vs 4096), causing
    ; esp_bt_controller_init() to fail with ESP_ERR_INVALID_ARG.

    ; --- Force Strings to Flash ---
    -DPSTR_ALIGN=1

    ; --- Network includes (for ESPAsyncWebServer) ---
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
    -I $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src

    ; --- Generated version header (scripts/generate_version.py) ---
    -I generated

    ; --- One shared copy of the ArialMT fonts (see lib/Fonts/FontLinkage.h).
    ; Without it every .cpp that uses a font links its own copy. ---
    -include lib/Fonts/FontLinkage.h

    ; --- Keep iostream out of the image. audio-tools v1.2.0
    ; (Collections/BitVector.h) includes <iostream> without using it, and
    ; that header's static ios_base::Init object links the whole iostream +
    ; locale runtime (~200 KB). Pre-defining libstdc++'s own include guard
    ; turns every #include <iostream> into a no-op; code that really used
    ; std::cout would fail to compile rather than silently grow the image. ---
    -D_GLIBCXX_IOSTREAM=1

    ; --- No C++ exceptions in our code or the libraries we compile (no code
    ; throws or catches; the framework default is -fexceptions, unflagged
    ; below). Drops the unwind tables. A failed `new` still ends in abort,
    ; as before. The precompiled framework libs are unaffected. ---
    -fno-exceptions

build_unflags =
    -I src
    -fexceptions

monitor_speed = 921600
monitor_filters = esp32_exception_decoder

extra_scripts =
    ; Must stay first: patches PlatformIO's library setup before any build
    ; step runs (see the script).
    pre:scripts/memoize_lib_build.py
    pre:scripts/cfsprite_assets.py
    pre:scripts/generate_version.py
    pre:scripts/gzip_portal_page.py
    pre:scripts/add_network_lib.py
    pre:scripts/add_iram_diet.py
    post:scripts/merge_firmware.py
    ; Registers the `sdpack` target only (pio run -t sdpack) — the phone
    ; companion is NOT built by a normal `pio run`. See scripts/build_companion.py
    pre:scripts/build_companion.py

; ============================================================
; Release-only flags (local, remote; NOT local_test)
; ============================================================
; audio-tools' own logger writes library warnings/errors to the serial
; console. Release builds compile it out, with its message + function-name
; strings (~38 KB); the test-CLI build keeps it for bench debugging. Our
; own code logs via ESP_LOGx either way.
[release]
build_flags =
    -DUSE_AUDIO_LOGGING=false

; ============================================================
; Local USB serial flash
; ============================================================
[env:local]
extends = base
upload_speed = 921600
build_flags =
    ${base.build_flags}
    ${release.build_flags}

; ============================================================
; Local + test-mode Serial CLI (device-control verbs for test
; automation: apps / launch / app / net / wifi). Never enable
; CF_TEST_CLI in a release or remote build.
; ============================================================
[env:local_test]
extends = base
upload_speed = 921600
build_flags =
    ${base.build_flags}
    -DCF_TEST_CLI=1

; ============================================================
; Bench only: local_test with a 60 s battery timer wake instead of the
; hourly one, so a background check-in on a timer wake can be watched in
; minutes (with `cloud due <sec>`). Never a release setting.
; ============================================================
[env:local_test_fastwake]
extends = base
upload_speed = 921600
build_flags =
    ${base.build_flags}
    -DCF_TEST_CLI=1
    -DCF_UVLO_CHECK_INTERVAL_S=60

; ============================================================
; Remote SSH flash (via flash_remote.bat)
; ============================================================
[env:remote]
extends = base
build_flags =
    ${base.build_flags}
    ${release.build_flags}
upload_protocol = custom
; Invocation rules (each part matters):
;   cmd /c        - .bat must run through the interpreter; SCons can't exec a .bat directly
;   $PROJECT_DIR  - absolute path; bare 'flash_remote.bat' fails when the OS has
;                   NoDefaultCurrentDirectoryInExePath=1 (disables CWD exe search)
;   no quotes     - SCons re-escapes quotes; wrapping the path in "..." double-escapes
;                   it into a bogus filename -> "The system cannot find the path specified"
upload_command = cmd /c $PROJECT_DIR\flash_remote.bat $SOURCE

; ============================================================
; Native test environments
; ============================================================
;
; These envs build & run on the developer's host (laptop) using the
; system compiler — fast feedback, no device or Arduino runtime.
; See test/README for the layout convention. See N-012 for the
; migration trigger when this list outgrows the central config.
;
; PlatformIO 6.x doesn't accept `test_dir` at the env level (it's a
; `[platformio]`-section option only). So tests for all envs live
; under the central `test/` directory; per-env scoping uses
; `test_filter` against `test_<scope>_*` naming convention.
;
; Run:  pio test -e test_core       (or)  pio test -e test_breakout
;       pio test                          (all envs above)
;
; Note: pio test inherits extra_scripts from any [platformio] /
; [base] section globally. We override with empty extra_scripts here
; so the SCons-based generate_version.py / add_iram_diet etc.
; (which target Arduino-ESP32) aren't pulled into native builds.

[env:test_core]
platform        = native
test_framework  = unity
test_filter     = test_core_*
extra_scripts   =
; lib_ldf_mode = off prevents PIO's auto-discovery from pulling Arduino-
; dependent libs in lib/ into the native build. Test envs include only
; what they explicitly list in lib_deps + what -I exposes.
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
    file://lib/BoardInfo
    file://lib/OtaManifest
    file://lib/TrustedRoots
    file://lib/UpdatePolicy
    file://lib/DataScreensaver
build_flags     = -std=gnu++17 -DHOST_TEST=1 -I lib/BoardInfo -I lib/OtaManifest -I lib/TrustedRoots -I lib/UpdatePolicy -I lib/DataScreensaver

[env:test_power]
platform        = native
test_framework  = unity
test_filter     = test_power_*
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
build_flags     =
    -std=gnu++17
    -DHOST_TEST=1
    -I lib/UvloGuard

; Note: pio test inherits extra_scripts from any [platformio] / [base]
; section globally. We override with empty extra_scripts here
; so the SCons-based generate_version.py / add_iram_diet etc.
; (which target Arduino-ESP32) aren't pulled into native builds.
[env:test_power_diary]
platform        = native
test_framework  = unity
test_filter     = test_power_diary
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
build_flags     =
    -std=gnu++17
    -DHOST_TEST=1
    -I lib/BatteryDiary

[env:test_sd]
platform        = native
test_framework  = unity
test_filter     = test_sd_*
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
    file://lib/HALMock
    file://lib/SDManager
build_flags     =
    -std=gnu++17
    -DHOST_TEST=1
    -I lib/HALMock
    -I lib/SDManager

[env:test_breakout]
platform        = native
