[env:test_loadout]
platform        = native
test_framework  = unity
test_filter     = test_loadout_*
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
    file://lib/LoadoutManifest
build_flags     =
    -std=gnu++17
    -DHOST_TEST=1
    -I lib/LoadoutManifest
    ; test_loadout_merge reads the real registry rows from AppManifest.h
    -I lib/AppDefs

[env:test_sync]
platform        = native
test_framework  = unity
test_filter     = test_sync_*
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
    throwtheswitch/Unity@^2.6.1
    file://lib/SyncProtocol
    file://lib/LoadoutManifest
    file://lib/CloudSync
    ; cJSON for the host build of CloudProtocol: the release the ESP32
    ; framework ships (1.7.18), vendored for tests only.
    file://test/vendor/cJSON
build_flags     =
    -std=gnu++17
    -DHOST_TEST=1
    -I lib/SyncProtocol
    -I lib/LoadoutManifest
    -I lib/CloudSync
    -I test/vendor/cJSON

[env:test_upd_policy]
platform        = native
test_framework  = unity
test_filter     = test_upd_policy_*
extra_scripts   =
lib_ldf_mode    = off
lib_deps        =
