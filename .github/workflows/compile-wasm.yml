name: Compile App to WASM
run-name: Compile ${{ inputs.app_name || 'demo' }} [cid:${{ inputs.correlation_id }}]

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App class name (e.g. MyApp). Leave empty to build the default demo.'
        required: false
        default: ''
      app_instance:
        description: 'Global instance variable name (e.g. myApp). Auto-derived if empty.'
        required: false
        default: ''
      app_header_b64:
        description: 'Base64-encoded .h file content'
        required: false
        default: ''
      app_cpp_b64:
        description: 'Base64-encoded .cpp file content'
        required: false
        default: ''
      correlation_id:
        description: 'Opaque id echoed into the run name so the dispatcher can match its exact run (avoids binding a concurrent workflow run)'
        required: false
        default: ''

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify wasm directory exists
        run: |
          if [ ! -f "wasm/CMakeLists.txt" ]; then
            echo "::error::wasm/CMakeLists.txt not found. Make sure your fork is synced with the upstream repo."
            echo "Files in repo root:"
            ls -la
            echo "Contents of wasm/ (if it exists):"
            ls -la wasm/ 2>/dev/null || echo "wasm/ directory does not exist"
            exit 1
          fi
          echo "wasm/CMakeLists.txt found"

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.51

      - name: Install Emscripten SDK
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 3.1.51
          ./emsdk activate 3.1.51

      - name: Install build tools
        run: pip install ninja

      - name: Cache WASM build artifacts
        uses: actions/cache@v4
        with:
          path: wasm/build
          key: wasm-build-${{ hashFiles('wasm/CMakeLists.txt', 'lib/**', 'wasm/hal/**', 'wasm/shims/**') }}
          restore-keys: wasm-build-

      - name: Decode and write custom app (if provided)
        if: inputs.app_name != '' && inputs.app_header_b64 != ''
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_HEADER_B64: ${{ inputs.app_header_b64 }}
          APP_CPP_B64: ${{ inputs.app_cpp_b64 }}
        run: |
          # Do NOT echo file listings or head the decoded source. Logs
          # on this workflow are public-readable; APP_NAME and source
          # code would leak through head/ls into the public log. Compile
          # errors below still surface user code on failure, which is
          # unavoidable without a custom log rewriter; build.html
          # discloses that residual exposure to the user.
          mkdir -p wasm/app
          echo "${APP_HEADER_B64}" | base64 -d > "wasm/app/${APP_NAME}.h"
          echo "${APP_CPP_B64}" | base64 -d > "wasm/app/${APP_NAME}.cpp"
          printf '#include "App.h"\n#include "%s.h"\n' "${APP_NAME}" > wasm/app/app_include.h

      - name: Generate version.h
        env:
          CYBERFIDGET_BUILD_TYPE_OVERRIDE: wasm
        run: |
          mkdir -p wasm/generated
          python scripts/generate_version.py --standalone --out wasm/generated/version.h --repo-root .

      - name: Build WASM
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_INSTANCE: ${{ inputs.app_instance }}
          APP_HEADER_B64: ${{ inputs.app_header_b64 }}
        run: |
          source emsdk/emsdk_env.sh

          mkdir -p wasm/build

          CMAKE_CMD="emcmake cmake"
          CMAKE_CMD="$CMAKE_CMD -S wasm -B wasm/build"
          CMAKE_CMD="$CMAKE_CMD -G Ninja"
          CMAKE_CMD="$CMAKE_CMD -DCMAKE_BUILD_TYPE=Release"

          if [ -n "$APP_NAME" ] && [ -n "$APP_HEADER_B64" ]; then
            CMAKE_CMD="$CMAKE_CMD -DWASM_APP=Custom"
            CMAKE_CMD="$CMAKE_CMD -DCUSTOM_APP_NAME=${APP_NAME}"
            if [ -n "$APP_INSTANCE" ]; then
              CMAKE_CMD="$CMAKE_CMD -DCUSTOM_APP_INSTANCE=${APP_INSTANCE}"
            fi
          fi

          # Do NOT echo the assembled cmake invocation -- it contains
          # -DCUSTOM_APP_NAME=${APP_NAME} which would leak APP_NAME into
          # the public log. CMake's own output below is sufficient for
          # debugging the build.
          $CMAKE_CMD

          cmake --build wasm/build

          echo "=== Build output ==="
          ls -la wasm/build/cyberfidget.*

      - name: Build device-profile WASM
        if: inputs.app_name != '' && inputs.app_header_b64 != ''
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_INSTANCE: ${{ inputs.app_instance }}
        run: |
          # Do NOT echo APP_NAME or source paths containing it. Workflow logs
          # are public-readable, so preserve the custom-app source discipline
          # from the emulator build above.
          source emsdk/emsdk_env.sh
          APP_INSTANCE="${APP_INSTANCE:-$APP_NAME}"
          bash wasm/device_module/build_custom_device_app.sh \
            "$APP_NAME" "$APP_INSTANCE" wasm/app wasm/build/cyberfidget.device.wasm

      - name: Verify device-profile WASM contract
        if: inputs.app_name != '' && inputs.app_header_b64 != ''
        run: |
          source emsdk/emsdk_env.sh
          # emsdk_env only puts upstream/emscripten on PATH; the binaryen
          # tools (wasm-dis) live in upstream/bin. Add it, with an apt
          # fallback in case a future emsdk stops bundling binaryen.
          export PATH="$EMSDK/upstream/bin:$PATH"
          if ! command -v wasm-dis >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y binaryen
          fi
          DEVICE_WAT=wasm/build/cyberfidget.device.wat
          wasm-dis wasm/build/cyberfidget.device.wasm -o "$DEVICE_WAT"

          exports_ok=true
          for export_name in app_begin app_update app_end app_handle_button; do
            if grep -q "(export \"${export_name}\"" "$DEVICE_WAT"; then
              echo "Device WASM export ${export_name}: present"
            else
              echo "::error::Device WASM export ${export_name} is missing"
              exports_ok=false
            fi
          done

          imports_ok=true
          invalid_import_count=0
          while IFS= read -r import_module; do
            case "$import_module" in
              cf|wasi_snapshot_preview1|env) ;;
              *) invalid_import_count=$((invalid_import_count + 1)) ;;
            esac
          done < <(sed -nE 's/^[[:space:]]*\(import "([^"]+)".*/\1/p' "$DEVICE_WAT")
          if [ "$invalid_import_count" -eq 0 ]; then
            echo "Device WASM import modules: allowed"
          else
            echo "::error::Device WASM imports use ${invalid_import_count} unsupported module(s)"
            imports_ok=false
          fi

          initial_mem_ok=true
          memory_line="$(grep -m1 -E '^[[:space:]]*\(memory ' "$DEVICE_WAT" || true)"
          initial_pages="$(printf '%s\n' "$memory_line" | awk '{for (i = 2; i <= NF; i++) {gsub(/[()]/, "", $i); if ($i ~ /^[0-9]+$/) {print $i; exit}}}')"
          if [ -z "$initial_pages" ] || [ "$initial_pages" -gt 16 ]; then
            echo "::error::Device WASM initial memory is missing or exceeds 1 MiB"
            initial_mem_ok=false
          else
            echo "Device WASM initial memory: ${initial_pages} page(s), within 1 MiB"
          fi

          if [ "$exports_ok" != true ] || [ "$imports_ok" != true ] || [ "$initial_mem_ok" != true ]; then
            exit 1
          fi

          hal_abi="$(grep -E '^[[:space:]]*#define[[:space:]]+CF_HAL_ABI[[:space:]]+[0-9]+' wasm/device_module/cf_hal_abi.h | awk '{print $3}')"
          if ! [[ "$hal_abi" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to determine CF_HAL_ABI from cf_hal_abi.h"
            exit 1
          fi
          printf '{ "hal_abi": %s, "exports_ok": true, "imports_ok": true, "initial_mem_ok": true, "device_wasm": "cyberfidget.device.wasm" }\n' "$hal_abi" > wasm/build/device-build-meta.json
          echo "Device WASM contract: passed"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-app
          path: |
            wasm/build/cyberfidget.js
            wasm/build/cyberfidget.wasm
            wasm/build/cyberfidget.device.wasm
            wasm/build/device-build-meta.json
          retention-days: 7
