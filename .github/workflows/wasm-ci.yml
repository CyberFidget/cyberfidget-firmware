name: WASM build guard

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'wasm/**'
      - 'scripts/check_hal_imports_additive/**'
      - 'scripts/check_shim_drift/**'
      - 'scripts/generate_version.py'
      - '.github/workflows/wasm-ci.yml'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shim-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test and check device shim drift
        run: |
          python scripts/check_shim_drift/test_check_shim_drift.py
          python scripts/check_shim_drift/check_shim_drift.py

  hal-imports-additive:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check HAL imports stay additive
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          python scripts/check_hal_imports_additive/check_hal_imports_additive.py \
            --base-ref "origin/$BASE_REF"

  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.51

      - name: Install Emscripten SDK
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 3.1.51
          ./emsdk activate 3.1.51

      - name: Install build tools
        run: pip install ninja

      - name: Generate version.h
        env:
          CYBERFIDGET_BUILD_TYPE_OVERRIDE: wasm
        run: |
          mkdir -p wasm/generated
          python scripts/generate_version.py --standalone --out wasm/generated/version.h --repo-root .

      - name: Build emulator-profile WASM
        run: |
          source emsdk/emsdk_env.sh
          bash wasm/build_wasm.sh

      - name: Build device-profile WASM from example fixture
        run: |
          source emsdk/emsdk_env.sh
          export PATH="$EMSDK/upstream/bin:$PATH"
          bash wasm/device_module/build_custom_device_app.sh \
            StopwatchDemo stopwatchDemo wasm/device_module/example_app \
            wasm/build/cyberfidget.device.wasm

      - name: Verify example fixture device contract
        run: |
          source emsdk/emsdk_env.sh
          export PATH="$EMSDK/upstream/bin:$PATH"
          if ! command -v wasm-dis >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y binaryen
          fi
          bash wasm/device_module/verify_device_contract.sh wasm/build/cyberfidget.device.wasm

  core-app-list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.core-app-matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check shipped core app list is in sync
        run: bash wasm/device_module/check_core_apps_sync.sh

      - name: Load shipped core app matrix
        id: core-app-matrix
        run: echo "matrix=$(bash wasm/device_module/check_core_apps_sync.sh --matrix)" >> "$GITHUB_OUTPUT"

  core-device-build:
    name: Core device build (${{ matrix.app.module }})
    needs: core-app-list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.core-app-list.outputs.matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.51

      - name: Install Emscripten SDK
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 3.1.51
          ./emsdk activate 3.1.51

      - name: Build ${{ matrix.app.module }} device profile
        run: |
          source emsdk/emsdk_env.sh
          export PATH="$EMSDK/upstream/bin:$PATH"
          output_dir="wasm/build/device-core/${{ matrix.app.module }}"
          mkdir -p "$output_dir"
          echo "Building core app: ${{ matrix.app.module }}"
          bash wasm/device_module/build_custom_device_app.sh \
            "${{ matrix.app.module }}" "${{ matrix.app.instance }}" \
            "${{ matrix.app.src_dir }}" "$output_dir/${{ matrix.app.output }}"

      - name: Verify ${{ matrix.app.module }} device contract
        run: |
          source emsdk/emsdk_env.sh
          export PATH="$EMSDK/upstream/bin:$PATH"
          if ! command -v wasm-dis >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y binaryen
          fi
          echo "Verifying core app: ${{ matrix.app.module }}"
          bash wasm/device_module/verify_device_contract.sh \
            "wasm/build/device-core/${{ matrix.app.module }}/${{ matrix.app.output }}"
