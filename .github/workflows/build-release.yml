# =============================================================================
# build-release.yml -- cut a firmware release
# =============================================================================
# Two ways in, both supported (see docs/reference/release-process.md):
#
#   Path A -- push a tag (git tag v1.3.3 && git push origin v1.3.3)
#             Builds that exact tag and publishes the release. Fastest route
#             for an emergency hotfix.
#
#   Path B -- Actions > this workflow > "Run workflow"
#             Does the whole ritual in one shot: bump version.txt, commit it,
#             stamp CHANGELOG.md, create and push the tag, build, publish the
#             release, and (for a Stable release) make the post-release bump
#             so subsequent dev builds advertise the next version.
#
# Path B exists because doing it by hand is six commands with three chances to
# forget one, and forgetting the post-release bump is silent until weeks later.
#
# Note on the tag push below: GitHub deliberately does NOT re-trigger workflows
# for refs pushed with the default GITHUB_TOKEN, so Path B pushing a tag does
# not kick off a duplicate Path A run. Do not "fix" this with a PAT without
# adding a guard first.
# =============================================================================

name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading v (e.g. 1.3.3)'
        required: true
        type: string
      channel:
        description: 'Release tier'
        required: true
        default: 'rc'
        type: choice
        options: [rc, beta, alpha, release]
      iteration:
        description: 'Iteration number for rc/beta/alpha. Blank = next free one'
        required: false
        type: string
      post_release_bump:
        description: 'Post-release bump of version.txt (Stable releases only)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major, skip]
      dry_run:
        description: 'Rehearse: build and show the plan, but push and publish nothing'
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: 'Permit a version lower than the highest already-released one'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# One release at a time, repository-wide. Deliberately NOT keyed on the ref:
# the tag namespace is global, so two dispatches from different branches would
# otherwise be allowed to race each other for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Pinned deliberately. An unpinned `pip install platformio` is what broke
  # every release build in 2026-09: 6.2.0 began resolving the dependencies
  # declared by private libraries under lib/, which surfaced long-dormant
  # junk entries. Bump this on purpose, with a build to prove it, never by
  # drive-by. Keep it in step with what developers run locally.
  PLATFORMIO_VERSION: '6.2.0'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: generate_version.py and the
                           # iteration auto-pick both need them

      # ---------------------------------------------------------------------
      # Work out what we are releasing, before doing anything irreversible.
      # ---------------------------------------------------------------------
      - name: Resolve release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IN_VERSION: ${{ inputs.version }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_ITERATION: ${{ inputs.iteration }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            # Path A: the tag is the source of truth.
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            VERSION="${VERSION%%-*}"
            FILE_VER="$(tr -d '[:space:]' < version.txt)"
            if [ "$VERSION" != "$FILE_VER" ]; then
              echo "::error::tag $TAG (parsed '$VERSION') does not match version.txt '$FILE_VER'"
              echo "Bump version.txt to match the tag, or retag to match version.txt."
              exit 1
            fi
            CHANNEL="tag"
            DRY_RUN="false"
          else
            # Path B: build the tag from the form inputs.
            VERSION="$IN_VERSION"
            CHANNEL="$IN_CHANNEL"
            DRY_RUN="$IN_DRY_RUN"

            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version must be MAJOR.MINOR.PATCH with no leading v (got '$VERSION')"
              exit 1
            fi

            # Releases come from the default branch. Without this, a dispatch
            # from any feature branch would push a release commit onto that
            # branch, tag its HEAD, and publish firmware built from it.
            #
            # Rehearsals are exempt on purpose: a dry run pushes and publishes
            # nothing, and rehearsing a release-pipeline change from its own
            # branch BEFORE merging is how two branding bugs were caught that
            # no local build could reproduce. Blocking that would remove the
            # safety net rather than add one.
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && [ "$DRY_RUN" != "true" ]; then
              echo "::error::releases must be cut from $DEFAULT_BRANCH (this run selected '$REF_NAME')"
              echo "Merge your work first, then dispatch from $DEFAULT_BRANCH -- or tick dry_run to rehearse from here."
              exit 1
            fi
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::warning::rehearsing from '$REF_NAME'. A real release must be cut from $DEFAULT_BRANCH."
            fi

            if [ "$CHANNEL" = "release" ]; then
              TAG="v$VERSION"
            elif [ -n "$IN_ITERATION" ]; then
              TAG="v$VERSION-$CHANNEL$IN_ITERATION"
            else
              # Highest existing iteration + 1, NOT the first free slot. Filling
              # a gap (rc1 and rc3 exist, rc2 was deleted) would publish an rc2
              # that is newer than rc3, which reads as a rollback to anyone
              # watching the releases page.
              HIGHEST_N="$(git tag --list "v$VERSION-$CHANNEL*" \
                            | sed "s/^v$VERSION-$CHANNEL//" \
                            | grep -E '^[0-9]+$' \
                            | sort -n | tail -n1 || true)"
              TAG="v$VERSION-$CHANNEL$(( ${HIGHEST_N:-0} + 1 ))"
            fi

            # A prerelease for a version that already shipped as Stable is
            # almost always a mistake -- v1.4.0-rc1 sorts BEFORE v1.4.0, so it
            # would present as a downgrade.
            if [ "$CHANNEL" != "release" ] \
               && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
              if [ "${{ inputs.allow_downgrade }}" = "true" ]; then
                echo "::warning::v$VERSION already shipped as Stable; cutting a prerelease for it on the override."
              else
                echo "::error::v$VERSION has already shipped as Stable; a $CHANNEL for it would read as a downgrade."
                echo "Pick the next version, or re-run with allow_downgrade if this is deliberate."
                exit 1
              fi
            fi

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG already exists. Pick another iteration, or delete the tag first."
              exit 1
            fi

            # A release can exist without its tag -- someone drafting notes in
            # the UI creates exactly that. action-gh-release would find that
            # draft by name and overwrite its body, assets, and prerelease flag.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::a GitHub release named $TAG already exists (possibly a draft)."
              echo "Delete or rename it first; this workflow would otherwise overwrite it."
              exit 1
            fi

            # A misclick must not publish 1.2.0 over a shipped 1.4.2.
            #
            # Only STABLE tags count as "released". Prerelease tags are excluded
            # deliberately: a stray v2.0.0-rc1 left behind by an abandoned
            # release would otherwise register as 2.0.0 and block every
            # legitimate 1.x release from then on.
            #
            # The base is the highest released version rather than version.txt,
            # because version.txt is pre-bumped to the upcoming target and then
            # stays put across an rc1/rc2/rc3 series -- comparing against it
            # would reject every legitimate RC. Equality is allowed: that is how
            # an RC series is promoted to Stable.
            HIGHEST="$(git tag --list 'v*' \
                        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                        | sed 's/^v//' \
                        | sort -V | tail -n1 || true)"
            if [ -n "$HIGHEST" ]; then
              LOWEST="$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | head -n1)"
              if [ "$VERSION" != "$HIGHEST" ] && [ "$LOWEST" = "$VERSION" ]; then
                if [ "${{ inputs.allow_downgrade }}" = "true" ]; then
                  echo "::warning::$VERSION is below the highest released version $HIGHEST; proceeding on the downgrade override."
                else
                  echo "::error::refusing to release $VERSION: it is lower than the highest released version $HIGHEST."
                  echo "Re-run with allow_downgrade if this is deliberate."
                  exit 1
                fi
              fi
            fi
          fi

          # Prerelease for anything that is not a bare vX.Y.Z tag.
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            PRERELEASE="false"
          else
            PRERELEASE="true"
          fi

          # Previous release tag, for the changelog compare link.
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname \
                       | grep -vx "$TAG" | head -n1 || true)"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "previous=$PREVIOUS"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Channel | \`$CHANNEL\` |"
            echo "| Pre-release | \`$PRERELEASE\` |"
            echo "| Previous release | \`${PREVIOUS:-none}\` |"
            echo "| Dry run | \`$DRY_RUN\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Dry run::Building only. No commit, tag, or release will be published."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------------------------------
      # Bump version.txt and close out the changelog (Path B only).
      # Done before the build so the built binary reports the release version.
      # ---------------------------------------------------------------------
      # The changelog is stamped for Stable only, mirroring the post-release
      # bump rule: an RC series iterates toward one Stable target, so the notes
      # stay in [Unreleased] across rc1/rc2/rc3 and are closed out once, when
      # Stable ships. Stamping at rc1 instead would empty [Unreleased], so rc2
      # would abort for having no summary -- or, if fixes landed in between,
      # produce a second [1.3.3] heading and a duplicate link reference.
      # RC notes still read from [Unreleased]; nothing is lost by not stamping.
      - name: Bump version.txt and stamp the changelog
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf '%s\n' "$VERSION" > version.txt

          # An empty [Unreleased] section fails on purpose, for every channel:
          # a release with no human summary is a release nobody can read.
          if [ "$CHANNEL" = "release" ]; then
            python scripts/release_notes.py stamp \
              --version "$VERSION" --tag "$TAG" --previous-tag "$PREVIOUS"
          else
            python scripts/release_notes.py extract > /dev/null
            echo "$CHANNEL release: leaving [Unreleased] open for the Stable promotion."
          fi

          if git diff --quiet -- version.txt CHANGELOG.md; then
            echo "version.txt and CHANGELOG.md already current, nothing to commit"
          else
            git add version.txt CHANGELOG.md
            git commit -m "chore(release): $TAG"
          fi

      # After stamping, the summary sits under the version heading; on the tag
      # path no stamp ran, so it is still under [Unreleased]. The helper tries
      # both. Always leaves a readable file behind so body_path is never empty.
      # Written to RUNNER_TEMP, never into the checkout. An untracked file in the
      # workspace makes `git status --porcelain` non-empty, which generate_version.py
      # reads as a dirty tree -- that is how a clean CI build came out branded
      # "1.3.3+2578226.dirty". Release binaries must never be marked dirty.
      - name: Collect release summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SUMMARY: ${{ runner.temp }}/release-summary.md
        run: |
          set -euo pipefail
          python scripts/release_notes.py section --version "$VERSION" > "$SUMMARY"
          if [ ! -s "$SUMMARY" ]; then
            echo "::warning::No changelog summary found; release notes will be the commit list only."
            printf '_No summary was recorded in CHANGELOG.md for this release._\n' > "$SUMMARY"
          fi
          echo "SUMMARY_PATH=$SUMMARY" >> "$GITHUB_ENV"
          echo "--- release summary ---"
          cat "$SUMMARY"

      # The build must start from a pristine tree, or the binary is branded
      # .dirty and the version check below rejects it. Fail here instead, where
      # the message says which file is responsible.
      - name: Assert a clean tree before building
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean; a release binary would be branded .dirty"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean."

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}" esptool

      # scripts/generate_version.py decides the build type and prerelease suffix
      # from the tag. On the tag path GITHUB_REF_NAME already is the tag; on the
      # dispatch path it is the branch, because the tag does not exist yet.
      #
      # Overriding GITHUB_REF_NAME here does NOT work: GitHub re-injects its own
      # GITHUB_* defaults into the process environment, so the step-level value
      # is silently discarded and the binary comes out branded "1.3.3 / ci-dev"
      # while the run is cutting v1.3.3-rc2. CYBERFIDGET_RELEASE_TAG is ours and
      # nothing stomps it. Both paths then produce identical version strings.
      - name: Build firmware
        env:
          CYBERFIDGET_RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: pio run -e local

      # Cheap insurance against shipping a binary that reports the wrong thing.
      # The device's boot banner and `version` CLI report FW_VERSION_FULL_STRING
      # verbatim, so if this does not match the tag, nothing downstream will.
      - name: Verify embedded version matches the tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          HEADER="generated/version.h"
          field() { sed -n "s/^#define $1 \"\\(.*\\)\"$/\\1/p" "$HEADER"; }

          FULL="$(field FW_VERSION_FULL_STRING)"
          TYPE="$(field FW_BUILD_TYPE)"
          DIRTY="$(sed -n 's/^#define FW_GIT_DIRTY \([0-9]*\)$/\1/p' "$HEADER")"
          EXPECTED_BASE="${TAG#v}"

          echo "Embedded: $FULL (type=$TYPE, dirty=$DIRTY)"
          echo "Expected base: $EXPECTED_BASE"

          # Checked explicitly: the base comparison below stops at the first
          # "+", so a ".dirty" suffix living in the build-metadata segment would
          # otherwise sail straight through it.
          if [ "$DIRTY" != "0" ]; then
            echo "::error::built from a dirty tree; a release binary must be reproducible from a commit"
            cat "$HEADER"
            exit 1
          fi
          if [ "${FULL%%+*}" != "$EXPECTED_BASE" ]; then
            echo "::error::embedded version '$FULL' does not match tag '$TAG'"
            cat "$HEADER"
            exit 1
          fi
          case "$TYPE" in
            release|prerelease) ;;
            *)
              echo "::error::build type is '$TYPE'; a release build must be release or prerelease"
              cat "$HEADER"
              exit 1
              ;;
          esac
          echo "FW_VERSION=$FULL" >> "$GITHUB_ENV"
          echo "Embedded version \`$FULL\` (type \`$TYPE\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge firmware binary
        run: |
          python -m esptool --chip esp32 merge_bin \
            -o .pio/build/local/merged_firmware.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x1000 .pio/build/local/bootloader.bin \
            0x8000 .pio/build/local/partitions.bin \
            0x10000 .pio/build/local/firmware.bin

      - name: Verify merged binary exists
        run: |
          set -euo pipefail
          MERGED=".pio/build/local/merged_firmware.bin"
          if [ ! -f "$MERGED" ]; then
            echo "ERROR: merged_firmware.bin not found!"
            echo "Contents of build dir:"
            ls -la .pio/build/local/
            exit 1
          fi
          echo "MERGED_PATH=$MERGED" >> "$GITHUB_ENV"
          echo "Merged firmware: $(stat -c%s "$MERGED") bytes"

      # --- Phone companion SD pack (BEST EFFORT) ------------------------
      # Not part of the firmware image: it's a web app the device serves off
      # the memory card at /web/. Built here so releases ship a ready-to-copy
      # pack instead of requiring users to install Node and build it.
      #
      # Deliberately runs AFTER the firmware is built and verified, and every
      # step is continue-on-error: the companion is a nice-to-have with a
      # fast-moving npm dependency tree, while firmware may need to ship
      # urgently for a critical bug. A dead package link must never block a
      # firmware release. If these steps fail the release still publishes,
      # with the firmware binary and a loud warning about the missing pack.
      - name: Set up Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal-companion/package-lock.json

      - name: Build phone companion SD pack
        id: companion_build
        continue-on-error: true
        if: steps.node.outcome == 'success'
        working-directory: portal-companion
        run: |
          npm ci
          npm run build

      - name: Package companion pack
        id: companion_pack
        continue-on-error: true
        if: steps.companion_build.outcome == 'success'
        run: |
          PACK="portal-companion/dist/web"
          if [ ! -f "$PACK/index.html" ]; then
            echo "::error::companion pack missing $PACK/index.html"
            exit 1
          fi
          # Zip the folder as `web` so it extracts straight onto the card root.
          (cd portal-companion/dist && zip -qr "$GITHUB_WORKSPACE/companion-pack.zip" web)
          # Also publish the shell alone: live listening needs only this ~50 KB
          # file, so most people never need the 32 MB pack at all.
          cp "$PACK/index.html" companion-index.html
          ls -lh companion-pack.zip companion-index.html

      - name: Flag missing companion pack
        if: steps.companion_pack.outcome != 'success'
        run: |
          echo "::warning::Companion SD pack was NOT built - this release ships firmware only."
          echo "::warning::Users needing the phone companion must build it from portal-companion/ or take it from an earlier release."

      # ---------------------------------------------------------------------
      # Publish. Nothing below this line runs on a dry run.
      # ---------------------------------------------------------------------
      # Branch and tag go up in ONE atomic push. Pushed separately, a rejected
      # branch push after a successful tag push (or the reverse) leaves the
      # repository in a half-released state that the next run cannot recover
      # from on its own. --atomic makes the server apply both refs or neither.
      - name: Push release commit and tag
        if: github.event_name == 'workflow_dispatch' && steps.plan.outputs.dry_run != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin "HEAD:$BRANCH" "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.plan.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: ${{ steps.plan.outputs.tag }}
          # The changelog summary heads the notes; GitHub appends the full
          # commit list since the previous release underneath it.
          body_path: ${{ env.SUMMARY_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.plan.outputs.prerelease }}
          # Companion assets are absent when the best-effort steps above fail;
          # unmatched patterns must not fail the release.
          fail_on_unmatched_files: false
          files: |
            ${{ env.MERGED_PATH }}
            companion-pack.zip
            companion-index.html

      # ---------------------------------------------------------------------
      # Post-release bump. Stable only: an RC series iterates toward a single
      # Stable target, so version.txt stays put across rc1, rc2, rc3. After
      # Stable ships, advancing it keeps dev builds from advertising a version
      # that is already out.
      # ---------------------------------------------------------------------
      - name: Post-release bump
        if: >-
          github.event_name == 'workflow_dispatch'
          && steps.plan.outputs.dry_run != 'true'
          && steps.plan.outputs.channel == 'release'
          && inputs.post_release_bump != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUMP: ${{ inputs.post_release_bump }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          printf '%s\n' "$NEXT" > version.txt
          git add version.txt
          git commit -m "chore: post-release bump to $NEXT"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "Post-release bump: $VERSION -> $NEXT" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        if: always()
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          DRY: ${{ steps.plan.outputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "Dry run complete for $TAG - nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
